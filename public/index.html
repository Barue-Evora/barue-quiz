<!doctype html><html lang="pt-PT"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#12372A"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;700;800&family=Archivo+Black&display=swap"><link rel="stylesheet" href="/style.css"><title>Barue Quiz</title></head><body>
<main class="phone"><div class="center">
<div class="brand big" id="b" style="justify-content:center"></div>
<p class="muted">Cria um jogo novo para esta noite.</p>
<form id="f" style="display:grid;gap:12px">
<label>PIN do anfitrião <input id="pin" type="password" autocomplete="off"></label>
<button>Criar jogo</button></form><div class="error" id="e" role="alert"></div>
</div></main>
<script src="/common.js"></script><script>
b.append(logo(), h('span', null, 'BARUE ', h('b', null, 'QUIZ')));
f.addEventListener('submit', async (ev) => {
  ev.preventDefault();
  const r = await fetch('/api/games', { method:'POST', headers:{'content-type':'application/json'}, body: JSON.stringify({ pin: pin.value }) });
  const d = await r.json();
  if (!r.ok) { e.textContent = d.error || 'Não foi possível criar o jogo.'; return; }
  location.href = '/host?code=' + d.code + '#' + d.hostToken;
});
</script></body></html>
